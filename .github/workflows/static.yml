# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # upload-pages-artifact 的 path 只接受单个目录，不接受文件清单
      # （此前直接把多行清单塞给 path，每次部署都失败，线上停更在旧版）。
      # 因此先把要上线的四个文件组装进 site/ 再整目录上传：
      # 不上传整个仓库 —— tools/（30+ 测试脚本）、.workbuddy/（内部工作记录）
      # 与需求文档不该被公开到线上。
      # 清单是明文的 cp 命令，文件改名时 GitHub 不报错，
      # 用 node tools/verify-workflow.js 把「声明」与磁盘对齐。
      - name: Assemble site directory
        run: |
          mkdir -p site
          cp anime-rewind.html index.html LICENSE .nojekyll site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
